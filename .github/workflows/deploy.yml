name: Deploy site

# Runs on your own pushes (including ratings saved from the Writers' Room) and is
# called by the other workflows, whose bot commits don't trigger push events.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Stage site files
        run: |
          mkdir _site
          cp -r index.html model.html writers-room.html 404.html assets data _site/
          # Browsers cache assets for 10 minutes; a content hash in each link makes them fetch the new ones.
          VERSION=$(cat assets/* | sha1sum | cut -c1-10)
          sed -i "s/?v=dev/?v=$VERSION/g" _site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
