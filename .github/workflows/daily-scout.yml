name: Daily model scout

# Checks OpenRouter's public model list once a day. Free: it never calls a model.
# Emails you only when a new major release shows up.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: check
        run: python3 scripts/check_models.py

      - name: Save model list
        run: |
          git config user.name "SeinBench Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models.json
          git diff --cached --quiet && exit 0
          git commit -m "Update model list"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 3)); git pull --rebase
          done
          exit 1

      - name: Email me about new major releases
        if: steps.check.outputs.notify == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/send_email.py

  deploy:
    needs: scout
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
